<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" width="560" height="200">
  <!-- LOGO ICON -->
  <g transform="translate(10, 0)">
    <!-- Outer hexagon border -->
    <polygon 
      points="50,2 93,25 93,75 50,98 7,75 7,25" 
      fill="none" 
      stroke="#7C3AED" 
      stroke-width="3"
      opacity="0.3"
    />
    
    <defs>
      <linearGradient id="hexGradientBrandLight" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#7C3AED" />
        <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.6" />
      </linearGradient>
    </defs>
    
    <!-- Inner filled hexagon -->
    <polygon 
      points="50,10 85,28 85,72 50,90 15,72 15,28" 
      fill="url(#hexGradientBrandLight)"
    />
    
    <!-- Inner cut hexagon (light background) -->
    <polygon 
      points="50,16 78,32 78,68 50,84 22,68 22,32" 
      fill="#FFFFFF"
    />
    
    <!-- 99% arc -->
    <circle
      cx="50"
      cy="50"
      r="12"
      fill="none"
      stroke="#7C3AED"
      stroke-width="4"
      stroke-linecap="round"
      stroke-dasharray="75.4"
      stroke-dashoffset="0.75"
      transform="rotate(-90 50 50)"
    />
    
    <!-- Center dot -->
    <circle cx="50" cy="50" r="3" fill="#7C3AED" opacity="0.6" />
    
    <!-- Accent dots -->
    <circle cx="50" cy="5" r="2" fill="#7C3AED" opacity="0.6" />
    <circle cx="50" cy="95" r="2" fill="#7C3AED" opacity="0.6" />
  </g>
  
  <!-- BRAND TEXT -->
  <text x="120" y="48" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#0A0A0B" letter-spacing="-0.5">AllInOne</text>
  <text x="120" y="68" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#71717A" letter-spacing="3" text-transform="uppercase">KNOWLEDGE</text>
</svg>